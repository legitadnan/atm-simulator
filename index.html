<!DOCTYPE html>
<html>
<head>
  <title>ATM Simulator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="atm">

  <div class="top">MERIDIAN<span>FED</span></div>

  <div class="screen" id="screen">
    <h2>ENTER PIN</h2>
    <p id="display"></p>
  </div>

  <div class="side-buttons left">
    <button onclick="select('exit')"></button>
    <button onclick="select('')"></button>
    <button onclick="select('')"></button>
    <button onclick="select('')"></button>
  </div>

  <div class="side-buttons right">
    <button onclick="menuSelect(1)"></button>
    <button onclick="menuSelect(2)"></button>
    <button onclick="menuSelect(3)"></button>
    <button onclick="menuSelect(4)"></button>
  </div>

  <div class="keypad">
    <button onclick="press(1)">1</button>
    <button onclick="press(2)">2</button>
    <button onclick="press(3)">3</button>

    <button onclick="press(4)">4</button>
    <button onclick="press(5)">5</button>
    <button onclick="press(6)">6</button>

    <button onclick="press(7)">7</button>
    <button onclick="press(8)">8</button>
    <button onclick="press(9)">9</button>

    <button onclick="clearInput()">C</button>
    <button onclick="press(0)">0</button>
    <button onclick="enter()">✔</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
